[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "text2sql-guardrails"
version = "0.1.0"
description = "Natural-language to SQL over PostgreSQL with safety guardrails and hallucination detection."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# Dependencies are added phase by phase, only when code actually uses them.
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "faker>=30",
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Local embedding model (pulls torch, ~1 GB). Not needed by unit tests or CI,
# which use a deterministic fake embedder.
embeddings = [
    "sentence-transformers>=3.0",
]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/text2sql"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "S",        # bandit (security) — relevant for a SQL project
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is fine in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: needs a running PostgreSQL (skipped in CI unit job)",
    "llm: calls the real LLM API (never run in CI)",
    "embeddings: loads the real sentence-transformers model (skipped if not installed)",
]
