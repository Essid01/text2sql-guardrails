- id: j11
  category: join_aggregate
  lang: en
  expect: answer
  question: >-
    What was the margin per category in 2025, defined as net revenue minus the quantity
    times the product's current unit cost?
  gold_sql: |
    SELECT c.name,
           ROUND(SUM(oi.quantity * oi.unit_price * (1 - oi.discount) - oi.quantity * p.unit_cost), 2)
    FROM order_items oi
    JOIN orders o ON o.order_id = oi.order_id
    JOIN products p ON p.product_id = oi.product_id
    JOIN categories c ON c.category_id = p.category_id
    WHERE o.status = 'completed' AND o.order_date >= '2025-01-01' AND o.order_date < '2026-01-01'
    GROUP BY c.name

