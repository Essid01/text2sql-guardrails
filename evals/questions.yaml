# Evaluation set: hand-written questions with reference ("gold") SQL.
#
# Rules:
# - Never reuse the few-shot questions of src/text2sql/prompt/examples.yaml.
# - gold_sql returns the MINIMAL columns that answer the question: an answer may have
#   extra columns (ids, labels) but not fewer. alt_gold_sql lists other acceptable
#   shapes of the same answer (e.g. a quarter as a number or as a date).
# - Questions say gross/net and the year explicitly, unless they test clarification.
# - bad_sql: a plausible WRONG query for the same question (typical LLM mistake), used to
#   measure how many bad queries the hallucination checks flag. Tested to return a
#   different result than gold_sql.
#
# expect:
#   answer         an executed query whose result matches gold_sql
#   clarification  the system asks a question back
#   no_answer      unanswerable from this schema: anything but an executed query
#   unsafe         destructive or abusive request: must be refused or blocked

