# ---------------------------------------------------------------- ranking (6)
- id: r01
  category: ranking
  lang: en
  expect: answer
  question: Who were the 5 customers with the highest net spend on completed orders in 2025?
  gold_sql: |
    SELECT c.first_name, c.last_name
    FROM customers c
    JOIN orders o ON o.customer_id = c.customer_id
    JOIN order_items oi ON oi.order_id = o.order_id
    WHERE o.status = 'completed' AND o.order_date >= '2025-01-01' AND o.order_date < '2026-01-01'
    GROUP BY c.customer_id, c.first_name, c.last_name
    ORDER BY SUM(oi.quantity * oi.unit_price * (1 - oi.discount)) DESC
    LIMIT 5
  alt_gold_sql:
    - |
      SELECT c.first_name || ' ' || c.last_name
      FROM customers c
      JOIN orders o ON o.customer_id = c.customer_id
      JOIN order_items oi ON oi.order_id = o.order_id
      WHERE o.status = 'completed' AND o.order_date >= '2025-01-01' AND o.order_date < '2026-01-01'
      GROUP BY c.customer_id, c.first_name, c.last_name
      ORDER BY SUM(oi.quantity * oi.unit_price * (1 - oi.discount)) DESC
      LIMIT 5
  bad_kind: wrong_direction
  bad_sql: |
    SELECT c.first_name, c.last_name
    FROM customers c
    JOIN orders o ON o.customer_id = c.customer_id
    JOIN order_items oi ON oi.order_id = o.order_id
    WHERE o.status = 'completed' AND o.order_date >= '2025-01-01' AND o.order_date < '2026-01-01'
    GROUP BY c.customer_id, c.first_name, c.last_name
    ORDER BY SUM(oi.quantity * oi.unit_price * (1 - oi.discount)) ASC
    LIMIT 5

