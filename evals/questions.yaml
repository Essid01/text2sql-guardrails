      WHERE o.status = 'completed' AND o.order_date >= '2025-01-01' AND o.order_date < '2026-01-01'
      GROUP BY c.region, o.order_id
    ) t
    GROUP BY region ORDER BY AVG(order_net) DESC LIMIT 1
  bad_kind: sum_instead_of_average
  bad_sql: |
    SELECT c.region
    FROM orders o
    JOIN customers c ON c.customer_id = o.customer_id
    JOIN order_items oi ON oi.order_id = o.order_id
    WHERE o.status = 'completed' AND o.order_date >= '2025-01-01' AND o.order_date < '2026-01-01'
    GROUP BY c.region ORDER BY SUM(oi.quantity * oi.unit_price * (1 - oi.discount)) DESC LIMIT 1

