# ---------------------------------------------------------- joins & aggregates (12)
- id: j01
  category: join_aggregate
  lang: en
  expect: answer
  question: What was the net revenue of each category in 2024?
  gold_sql: |
    SELECT c.name, ROUND(SUM(oi.quantity * oi.unit_price * (1 - oi.discount)), 2)
    FROM order_items oi
    JOIN orders o ON o.order_id = oi.order_id
    JOIN products p ON p.product_id = oi.product_id
    JOIN categories c ON c.category_id = p.category_id
    WHERE o.status = 'completed' AND o.order_date >= '2024-01-01' AND o.order_date < '2025-01-01'
    GROUP BY c.name
  bad_kind: gross_instead_of_net
  bad_sql: |
    SELECT c.name, ROUND(SUM(oi.quantity * oi.unit_price), 2)
    FROM order_items oi
    JOIN orders o ON o.order_id = oi.order_id
    JOIN products p ON p.product_id = oi.product_id
    JOIN categories c ON c.category_id = p.category_id
    WHERE o.status = 'completed' AND o.order_date >= '2024-01-01' AND o.order_date < '2025-01-01'
    GROUP BY c.name

