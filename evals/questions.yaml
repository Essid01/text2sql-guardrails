# ------------------------------------------------------------------- time (8)
- id: t01
  category: time
  lang: en
  expect: answer
  question: What was the net revenue for each quarter of 2025?
  gold_sql: |
    SELECT EXTRACT(QUARTER FROM o.order_date),
           ROUND(SUM(oi.quantity * oi.unit_price * (1 - oi.discount)), 2)
    FROM order_items oi JOIN orders o ON o.order_id = oi.order_id
    WHERE o.status = 'completed' AND o.order_date >= '2025-01-01' AND o.order_date < '2026-01-01'
    GROUP BY 1
  alt_gold_sql:
    - |
      SELECT DATE_TRUNC('quarter', o.order_date),
             ROUND(SUM(oi.quantity * oi.unit_price * (1 - oi.discount)), 2)
      FROM order_items oi JOIN orders o ON o.order_id = oi.order_id
      WHERE o.status = 'completed' AND o.order_date >= '2025-01-01' AND o.order_date < '2026-01-01'
      GROUP BY 1
  bad_kind: wrong_year
  bad_sql: |
    SELECT EXTRACT(QUARTER FROM o.order_date),
           ROUND(SUM(oi.quantity * oi.unit_price * (1 - oi.discount)), 2)
    FROM order_items oi JOIN orders o ON o.order_id = oi.order_id
    WHERE o.status = 'completed' AND o.order_date >= '2024-01-01' AND o.order_date < '2025-01-01'
    GROUP BY 1

- id: t02
  category: time
  lang: en
  expect: answer
  question: How many completed orders were placed on a Saturday or a Sunday in 2024?
  gold_sql: |
    SELECT COUNT(*) FROM orders
    WHERE status = 'completed' AND EXTRACT(ISODOW FROM order_date) IN (6, 7)
      AND order_date >= '2024-01-01' AND order_date < '2025-01-01'
  bad_kind: wrong_day_numbering
  bad_sql: |
    SELECT COUNT(*) FROM orders
    WHERE status = 'completed' AND EXTRACT(DOW FROM order_date) IN (6, 7)
      AND order_date >= '2024-01-01' AND order_date < '2025-01-01'

- id: t03
  category: time
  lang: en
  expect: answer
  question: Which month of 2024 had the most completed orders?
  gold_sql: |
    SELECT EXTRACT(MONTH FROM order_date) FROM orders
    WHERE status = 'completed' AND order_date >= '2024-01-01' AND order_date < '2025-01-01'
    GROUP BY 1 ORDER BY COUNT(*) DESC LIMIT 1
  alt_gold_sql:
    - |
      SELECT DATE_TRUNC('month', order_date) FROM orders
      WHERE status = 'completed' AND order_date >= '2024-01-01' AND order_date < '2025-01-01'
      GROUP BY 1 ORDER BY COUNT(*) DESC LIMIT 1
    - |
      SELECT TRIM(TO_CHAR(order_date, 'Month')) FROM orders
      WHERE status = 'completed' AND order_date >= '2024-01-01' AND order_date < '2025-01-01'
      GROUP BY 1 ORDER BY COUNT(*) DESC LIMIT 1

- id: t04
  category: time
  lang: en
  expect: answer
  question: Compare the net revenue of December 2024 with December 2025.
  gold_sql: |
    SELECT EXTRACT(YEAR FROM o.order_date),
           ROUND(SUM(oi.quantity * oi.unit_price * (1 - oi.discount)), 2)
    FROM order_items oi JOIN orders o ON o.order_id = oi.order_id
    WHERE o.status = 'completed' AND EXTRACT(MONTH FROM o.order_date) = 12
    GROUP BY 1
  alt_gold_sql:
    # Year labelled as a date (added after run 1: a correct answer was graded wrong).
    - |
      SELECT DATE_TRUNC('year', o.order_date)::date,
             ROUND(SUM(oi.quantity * oi.unit_price * (1 - oi.discount)), 2)
      FROM order_items oi JOIN orders o ON o.order_id = oi.order_id
      WHERE o.status = 'completed' AND EXTRACT(MONTH FROM o.order_date) = 12
      GROUP BY 1
    - |
      SELECT
        ROUND(SUM(oi.quantity * oi.unit_price * (1 - oi.discount))
              FILTER (WHERE o.order_date >= '2024-12-01' AND o.order_date < '2025-01-01'), 2),
        ROUND(SUM(oi.quantity * oi.unit_price * (1 - oi.discount))
              FILTER (WHERE o.order_date >= '2025-12-01' AND o.order_date < '2026-01-01'), 2)
      FROM order_items oi JOIN orders o ON o.order_id = oi.order_id
      WHERE o.status = 'completed'

